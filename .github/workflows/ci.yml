---
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (gcc, WITH_FFI=${{ matrix.with_ffi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        with_ffi: ["0", "1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runners normally ship libffi-dev.  Install it only when the headers
      # are really missing, so the gate does not depend on apt/network in the
      # normal case.  WITH_FFI=0 does not need libffi at all.
      - name: Ensure libffi headers
        if: matrix.with_ffi == '1'
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      - name: Build and test
        run: make WITH_FFI=${{ matrix.with_ffi }} test

  clang:
    name: linux (clang, WITH_FFI=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi
      - name: Build and test with clang
        run: make CC=clang WITH_FFI=1 test

  install:
    name: linux (staged install + pkg-config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi
      - name: Install into a staging root
        run: |
          set -eu
          make WITH_FFI=1 PREFIX=/usr/local DESTDIR="$PWD/stage" install
          test -x stage/usr/local/bin/luar
          test -f stage/usr/local/lib/libluar.a
          test -f stage/usr/local/lib/pkgconfig/luar.pc
          test -f stage/usr/local/lib/libluar.so.0.92.0
          test -L stage/usr/local/lib/libluar.so.0
          test -L stage/usr/local/lib/libluar.so
          LD_LIBRARY_PATH="$PWD/stage/usr/local/lib" \
            stage/usr/local/bin/luar -v | grep -q "Luar 0.92.0"

          export PKG_CONFIG_PATH="$PWD/stage/usr/local/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$PWD/stage"
          test "$(pkg-config --modversion luar)" = "0.92.0"
          pkg-config --exists 'luar >= 0.92.0'
          cc -O2 "$PWD/tests/embed/embed.c" \
            $(pkg-config --cflags --libs luar) -o stage/embed-shared
          LD_LIBRARY_PATH="$PWD/stage/usr/local/lib" \
            stage/embed-shared | grep -q "embed ok"
          cc -O2 "$PWD/tests/embed/embed.c" $(pkg-config --cflags luar) \
            stage/usr/local/lib/libluar.a -lm -ldl -o stage/embed-static
          stage/embed-static | grep -q "embed ok"

          make WITH_FFI=1 PREFIX=/usr/local DESTDIR="$PWD/stage" uninstall
          test ! -e stage/usr/local/bin/luar
          test ! -e stage/usr/local/lib/libluar.a
          test ! -e stage/usr/local/lib/libluar.so.0.92.0
          test ! -e stage/usr/local/lib/pkgconfig/luar.pc
          test ! -e stage/usr/local/include/luar/luar.h
          test ! -e stage/usr/local/share/man/man1/luar.1
      - name: Reproducible source tarball
        run: make test-dist

  nojit:
    name: linux (JIT=0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test without the JIT tier
        run: make JIT=0 test

  sanitizers:
    name: linux (ASan+UBSan, WITH_FFI=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      - name: Clean ASan/UBSan build, suites and fuzz
        run: tests/asan.sh

  fuzz:
    name: linux (deterministic cdef fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      # test-fuzz forces WITH_FFI=1 and wraps the fuzzer in timeout(1).
      - name: Fuzz ffi.cdef
        run: make test-fuzz

  upstream:
    name: upstream drift and shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      - name: Shared library
        run: make WITH_FFI=1 shared test-shared

      - name: Upstream drift check (offline)
        run: tools/upstream-check.sh

      - name: Shell scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck tools/*.sh tests/*.sh tests/upstream/*.sh
          else
            echo "shellcheck not installed; skipping"
          fi

  official-lua-suite:
    name: official Lua 5.5 suite (optional download)
    runs-on: ubuntu-latest
    # Downloads the upstream suite from lua.org; keep it advisory so a
    # transient network failure does not mask the deterministic gates.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)"

      - name: Official Lua suite
        run: tests/upstream/run.sh --jobs 2

  macos:
    name: macos (clang, optional)
    runs-on: macos-latest
    # Optional platform coverage: keep it visible without blocking the
    # Linux gate on runner-image quirks.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install readline and libffi
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install readline libffi
          rl="$(brew --prefix readline)"
          ffi="$(brew --prefix libffi)"
          echo "CPATH=$rl/include:$ffi/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$rl/lib:$ffi/lib" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" MYLIBS=-lreadline

      - name: Build shared library
        run: make shared

      - name: Test
        run: make test

      - name: Build and test FFI
        run: |
          make clean
          make WITH_FFI=1 MYLIBS=-lreadline -j"$(sysctl -n hw.ncpu)"
          make WITH_FFI=1 MYLIBS=-lreadline test
          make WITH_FFI=1 MYLIBS=-lreadline shared

      - name: Shared dylib and staged install
        run: |
          set -eu
          test -f src/libluar.0.92.0.dylib
          cc -O2 -Isrc tests/embed/embed.c -Lsrc -lluar -lm \
             -Wl,-rpath,"$PWD/src" -o embed-shared
          ./embed-shared | grep -q "embed ok"
          mkdir -p tests/tmp
          cc -dynamiclib -fPIC -Isrc tests/embed/module.c -Lsrc -lluar \
             -Wl,-rpath,"$PWD/src" -o tests/tmp/luartestmod.dylib
          ./src/luar -e "package.cpath='$PWD/tests/tmp/?.dylib'; assert(require('luartestmod').answer() == 42)"
          make PREFIX="$PWD/stage/usr/local" install
          test -f stage/usr/local/lib/libluar.0.92.0.dylib
          test -L stage/usr/local/lib/libluar.dylib
          PKG_CONFIG_PATH="$PWD/stage/usr/local/lib/pkgconfig" \
            pkg-config --exists 'luar >= 0.92.0'
          cc -O2 tests/embed/embed.c \
             $(PKG_CONFIG_PATH="$PWD/stage/usr/local/lib/pkgconfig" \
               pkg-config --cflags --libs luar) -lm \
             -Wl,-rpath,"$PWD/stage/usr/local/lib" -o embed-installed
          ./embed-installed | grep -q "embed ok"
