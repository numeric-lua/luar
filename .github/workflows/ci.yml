---
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (gcc, WITH_FFI=${{ matrix.with_ffi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        with_ffi: ["0", "1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runners normally ship libffi-dev.  Install it only when the headers
      # are really missing, so the gate does not depend on apt/network in the
      # normal case.  WITH_FFI=0 does not need libffi at all.
      - name: Ensure libffi headers
        if: matrix.with_ffi == '1'
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      - name: Build and test
        run: make WITH_FFI=${{ matrix.with_ffi }} test

  clang:
    name: linux (clang, WITH_FFI=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi
      - name: Build and test with clang
        run: make CC=clang WITH_FFI=1 test

  install:
    name: linux (staged install + pkg-config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi
      - name: Install into a staging root
        run: |
          make WITH_FFI=1 PREFIX=/usr/local DESTDIR="$PWD/stage" install
          test -x stage/usr/local/bin/luar
          test -f stage/usr/local/lib/libluar.a
          test -f stage/usr/local/lib/pkgconfig/luar.pc
          LD_LIBRARY_PATH="$PWD/stage/usr/local/lib" \
            stage/usr/local/bin/luar -v | grep -q "LuaR 0.1.0"
          PKG_CONFIG_PATH="$PWD/stage/usr/local/lib/pkgconfig" \
            pkg-config --exists luar
          PKG_CONFIG_PATH="$PWD/stage/usr/local/lib/pkgconfig" \
            pkg-config --cflags --libs luar
          make WITH_FFI=1 PREFIX=/usr/local DESTDIR="$PWD/stage" uninstall
          test ! -e stage/usr/local/bin/luar

  nojit:
    name: linux (JIT=0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test without the JIT tier
        run: make JIT=0 test

  sanitizers:
    name: linux (ASan+UBSan, WITH_FFI=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      - name: Clean ASan/UBSan build, suites and fuzz
        run: tests/asan.sh

  fuzz:
    name: linux (deterministic cdef fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      # test-fuzz forces WITH_FFI=1 and wraps the fuzzer in timeout(1).
      - name: Fuzz ffi.cdef
        run: make test-fuzz

  upstream:
    name: upstream drift and shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure libffi headers
        run: |
          if ! printf '#include <ffi.h>\n' | cc -E - >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libffi-dev
          fi

      - name: Shared library
        run: make WITH_FFI=1 shared test-shared

      - name: Upstream drift check (offline)
        run: tools/upstream-check.sh

      - name: Shell scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck tools/*.sh tests/*.sh tests/upstream/*.sh
          else
            echo "shellcheck not installed; skipping"
          fi

  macos:
    name: macos (clang, optional)
    runs-on: macos-latest
    # Optional platform coverage: keep it visible without blocking the
    # Linux gate on runner-image quirks.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: make test
